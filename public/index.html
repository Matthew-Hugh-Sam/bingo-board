<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sci ’29 Bingo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="panel">
    <h1 class="title">
      <span class="title-tag">Sci ’29</span>
      <span class="title-word">Bingo</span>
    </h1>

    <section class="block">
      <span class="label">Last number</span>
      <div class="led led-last" id="lastBall" role="status" aria-live="polite"></div>
    </section>

    <section class="block stats">
      <div class="stat">
        <span class="label">Called</span>
        <div class="stat-value"><div class="led led-count" id="calledCount"></div><span class="of">/ 90</span></div>
      </div>
      <div class="stat">
        <span class="label">Previous</span>
        <ol class="history" id="history" aria-label="Previous numbers, newest first"></ol>
      </div>
    </section>

    <div class="controls">
      <button id="drawBtn" class="primary">Draw random</button>
      <div class="row">
        <button id="undoBtn">Undo last</button>
        <button id="resetBtn">New game</button>
      </div>
      <span class="status" id="status"></span>
    </div>

    <p class="hint">Click a number to light it up. Click it again to switch it off.</p>
  </aside>

  <main class="stage">
    <div class="board" id="board" role="grid" aria-label="Bingo board, numbers 1 to 90"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
