<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sci ’29 Bingo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <h1 class="sign"><span class="sign-tag">Sci ’29</span> <span class="sign-word">Bingo</span></h1>

    <div class="module last-module">
      <span class="module-label">Last number</span>
      <div class="led led-cyan" id="lastBall" role="status" aria-live="polite"></div>
    </div>

    <div class="module side">
      <span class="module-label">Called <span class="of">/ 90</span></span>
      <div class="led led-amber counter" id="calledCount"></div>
      <span class="module-label">Previous</span>
      <ol class="history" id="history" aria-label="Previous numbers, newest first"></ol>
    </div>
  </header>

  <main class="housing">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="board" id="board" role="grid" aria-label="Bingo board, numbers 1 to 90"></div>
  </main>

  <footer class="controls">
    <button id="drawBtn" class="primary"><span class="lamp"></span>Draw random</button>
    <button id="undoBtn"><span class="lamp"></span>Undo last</button>
    <button id="resetBtn" class="danger"><span class="lamp"></span>New game</button>
    <span class="status" id="status"></span>
  </footer>

  <p class="hint">Click a number to light it up. Click it again to switch it off.</p>

  <script src="app.js"></script>
</body>
</html>
